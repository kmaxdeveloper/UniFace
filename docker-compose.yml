services:
  db:
    image: postgres:15
    container_name: uniface_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Bazada ham vaqt to'g'ri bo'lishi uchun
      TZ: Asia/Tashkent
    ports:
      - "5432:5432"
    # --- BU YERNI QO'SHIB QO'Y ---
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ---------------------------

  app:
    build: .
    container_name: uniface_api
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://uniface_db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update # <--- Buni ham qo'shib qo'yish xavfsizroq
      AWS_ACCESS_KEY: ${MY_AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${MY_AWS_SECRET_KEY}
      JWT_SECRET: ${MY_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # --- VAQT ZONASINI SOZLASH ---
      TZ: Asia/Tashkent
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Tashkent"
      # -----------------------------
    depends_on:
      - db

volumes:
  postgres_data: