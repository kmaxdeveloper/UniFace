services:
  db:
    image: postgres:15
    container_name: uniface_db
    environment:
      POSTGRES_DB: uniface_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: uniface_api
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/uniface_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: your_password_here
      AWS_ACCESS_KEY: your_aws_key
      AWS_SECRET_KEY: your_aws_secret
    depends_on:
      - db